<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Samuel and Josephine embossed champagne seal">
  <defs>
    <!-- Champagne gradient (warm cream / pale gold) -->
    <radialGradient id="champagne" cx="42%" cy="38%" r="70%">
      <stop offset="0%"  stop-color="#fff2dc"/>
      <stop offset="35%" stop-color="#ecd7b0"/>
      <stop offset="70%" stop-color="#cdb188"/>
      <stop offset="100%" stop-color="#9a7f56"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f6e6c6"/>
      <stop offset="50%" stop-color="#b9986a"/>
      <stop offset="100%" stop-color="#8c6c45"/>
    </linearGradient>
    <!-- Emboss / bevel filter -->
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4" specularConstant="1.1"
                          specularExponent="22" lighting-color="#fff5df" result="spec">
        <feDistantLight azimuth="135" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOnShape"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="specOnShape"/>
      </feMerge>
    </filter>
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feFlood flood-color="#5a4324" flood-opacity=".55"/>
      <feComposite in2="off" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3a2a10" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Outer rim -->
    <circle cx="200" cy="200" r="176" fill="url(#rim)"/>
    <!-- Main seal body -->
    <circle cx="200" cy="200" r="164" fill="url(#champagne)" filter="url(#emboss)"/>
    <!-- Inner engraved circle -->
    <circle cx="200" cy="200" r="140" fill="none" stroke="#8a6b40" stroke-width="1.2" opacity=".55"/>
    <circle cx="200" cy="200" r="132" fill="none" stroke="#fff2d8" stroke-width="0.8" opacity=".7"/>

    <!-- Tiny decorative dots around the ring -->
    <g fill="#8a6b40" opacity=".55">
      <circle cx="200" cy="42"  r="2.2"/>
      <circle cx="358" cy="200" r="2.2"/>
      <circle cx="200" cy="358" r="2.2"/>
      <circle cx="42"  cy="200" r="2.2"/>
      <circle cx="311" cy="89"  r="1.6"/>
      <circle cx="311" cy="311" r="1.6"/>
      <circle cx="89"  cy="311" r="1.6"/>
      <circle cx="89"  cy="89"  r="1.6"/>
    </g>

    <!-- Laurel branches (simplified) -->
    <g stroke="#7a5b34" stroke-width="1.6" fill="none" opacity=".55" stroke-linecap="round">
      <path d="M120 250 Q125 285 155 305"/>
      <path d="M280 250 Q275 285 245 305"/>
      <g fill="#7a5b34" opacity=".55" stroke="none">
        <ellipse cx="128" cy="262" rx="5" ry="2.2" transform="rotate(-30 128 262)"/>
        <ellipse cx="136" cy="276" rx="5" ry="2.2" transform="rotate(-30 136 276)"/>
        <ellipse cx="146" cy="290" rx="5" ry="2.2" transform="rotate(-30 146 290)"/>
        <ellipse cx="272" cy="262" rx="5" ry="2.2" transform="rotate(30 272 262)"/>
        <ellipse cx="264" cy="276" rx="5" ry="2.2" transform="rotate(30 264 276)"/>
        <ellipse cx="254" cy="290" rx="5" ry="2.2" transform="rotate(30 254 290)"/>
      </g>
    </g>

    <!-- S & J monogram -->
    <g font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" text-anchor="middle" filter="url(#innerShadow)">
      <text x="200" y="215"
            font-size="150" font-weight="500"
            fill="#6d4f28" letter-spacing="-4">
        <tspan>S</tspan>
        <tspan dx="-6" dy="-4" font-family="'Parisienne', cursive" font-size="90" fill="#8a6a3a">&amp;</tspan>
        <tspan dx="-4" dy="4">J</tspan>
      </text>
    </g>

    <!-- Bottom banner text -->
    <text x="200" y="308"
          font-family="'Cormorant Garamond', serif"
          font-size="18" letter-spacing="4"
          text-anchor="middle" fill="#6b4f2b" opacity=".85">
      SAMUEL &amp; JOSEPHINE
    </text>
    <text x="200" y="330"
          font-family="'Parisienne', cursive"
          font-size="18" text-anchor="middle" fill="#8c6a3d" opacity=".85">
      Always &amp; Forever
    </text>

    <!-- Subtle highlight on top-left for embossed feel -->
    <circle cx="150" cy="140" r="90" fill="#fff6e0" opacity=".18"/>
  </g>
</svg>
