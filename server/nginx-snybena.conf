server {
    server_name snybena.com;

    root /var/www/snybena.com;
    index index.html;

    charset utf-8;

    # These apply to API, manifest and error responses as well as the app.
    # Locations with Cache-Control repeat them because nginx replaces, rather
    # than merges, inherited add_header directives.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # the URL everyone actually visits — never serve a stale shell
    location = / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location = /service-worker.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
    }

    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Wedding API (Express + SQLite) — same origin, no CORS needed
    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This nginx is the public edge: discard client-supplied forwarding
        # chains so Express rate limits cannot trust a spoofed first IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 1 GiB file plus multipart fields; Express enforces the per-file limit.
        client_max_body_size 1100M;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Guest-uploaded media, served straight from disk
    location /uploads/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        alias /var/lib/wedding/uploads/;
        # explicit map — stock mime.types misses .wav/.weba recordings
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/heic heic;
            video/mp4 mp4 m4v;
            video/webm webm;
            video/quicktime mov;
            audio/webm weba;
            audio/mpeg mp3;
            audio/mp4 m4a;
            audio/ogg ogg;
            audio/wav wav;
            audio/aac aac;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend source ships in the repo but must never be served
    location ^~ /server/ {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    client_max_body_size 1100M;

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/snybena.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/snybena.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.snybena.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = snybena.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name snybena.com www.snybena.com;
    return 404; # managed by Certbot




}

# canonical origin is the apex — www serves a 301 so a guest's check-in
# (localStorage) always lives on one hostname no matter which link they opened
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name www.snybena.com;
    ssl_certificate /etc/letsencrypt/live/snybena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snybena.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://snybena.com$request_uri;
}
