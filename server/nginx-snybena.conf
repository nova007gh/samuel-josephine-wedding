server {
    server_name snybena.com www.snybena.com;

    root /var/www/snybena.com;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Wedding API (Express + SQLite) — same origin, no CORS needed
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 70M;
        proxy_read_timeout 120s;
    }

    # Guest-uploaded media, served straight from disk
    location /uploads/ {
        alias /var/lib/wedding/uploads/;
        # explicit map — stock mime.types misses .wav/.weba recordings
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/heic heic;
            video/mp4 mp4 m4v;
            video/webm webm;
            video/quicktime mov;
            audio/webm weba;
            audio/mpeg mp3;
            audio/mp4 m4a;
            audio/ogg ogg;
            audio/wav wav;
            audio/aac aac;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend source ships in the repo but must never be served
    location ^~ /server/ {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    client_max_body_size 70M;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/snybena.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/snybena.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.snybena.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = snybena.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name snybena.com www.snybena.com;
    return 404; # managed by Certbot




}
